services:
  perplexity-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: perplexity-mcp
    ports:
      - "${MCP_PORT:-8000}:8000"
    environment:
      # MCP 认证密钥
      - MCP_TOKEN=${MCP_TOKEN:-sk-123456}
      # 管理员 Token（用于号池管理 API）
      - PPLX_ADMIN_TOKEN=${PPLX_ADMIN_TOKEN:-}
      # SOCKS 代理配置 (可选)
      # 格式: socks5://[user[:pass]@]host[:port][#remark]
      # 示例: socks5://127.0.0.1:1080 或 socks5://user:pass@proxy.example.com:1080
      - SOCKS_PROXY=${SOCKS_PROXY:-}
      # 每日从 GitHub Raw 拉取由开发机发布的模型清单
      - PPLX_MODELS_CONFIG_URL=${PPLX_MODELS_CONFIG_URL:-https://raw.githubusercontent.com/escapeWu/perplexity-ai/main/catalog/model_config_v2.json}
    volumes:
      # 挂载 token 池配置文件（必需）
      - ./token_pool_config.json:/app/token_pool_config.json
      # 持久化 Perplexity 模型目录的每日缓存
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
