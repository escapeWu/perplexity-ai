[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "perplexity-api"
version = "1.15.0"
description = "Unofficial Perplexity MCP and OpenAI-compatible server with multi-account pooling"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "ESousa97", email = "contact@perplexity.ai"},
]
keywords = ["perplexity", "ai", "mcp", "openai", "search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "curl_cffi>=0.15.0,<0.16.0",
    "fastmcp>=0.1.0,<3.0.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.9.0",
    "aiohttp-socks>=0.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "mypy>=1.5.0",
    "flake8>=6.0.0",
    "isort>=5.12.0",
]

[project.scripts]
perplexity = "perplexity.server.main:main"
perplexity-model-sync = "perplexity.model_catalog_sync:main"

[project.urls]
Homepage = "https://github.com/escapeWu/perplexity-ai"
Repository = "https://github.com/escapeWu/perplexity-ai"
Issues = "https://github.com/escapeWu/perplexity-ai/issues"

[tool.setuptools.packages.find]
include = ["perplexity*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
